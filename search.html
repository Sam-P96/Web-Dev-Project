<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAXH - Search Cars</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="logo">YAXH</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="listings.html">Cars</a>
            <a href="car-form.html">Sell Your Car</a>
            <a href="#">About Us</a>
            <a href="#">Financing</a>
            <a href="#">Contact</a>
        </nav>

        <div class="nav-right">

            <select>
                <option>EN</option>
                <option>FI</option>
                <option>SV</option>
            </select>

            <a href="login.html" class="login-btn">
                Login
            </a>

        </div>

    </header>


    <main class="search-page">

        <div class="search-header">

            <p class="section-label">
                SEARCH YAXH
            </p>

            <h1>Find Your Next Car</h1>

            <p>
                Use the filters below to find a car that matches your needs.
            </p>

        </div>


        <div class="search-box">

            <div class="search-row">

                <div class="search-field">

                    <label>Make</label>

                    <select>
                        <option>All Makes</option>
                        <option>Audi</option>
                        <option>BMW</option>
                        <option>Mercedes-Benz</option>
                        <option>Volvo</option>
                        <option>Toyota</option>
                        <option>Tesla</option>
                    </select>

                </div>


                <div class="search-field">

                    <label>Model</label>

                    <select>
                        <option>All Models</option>
                        <option>A4</option>
                        <option>3 Series</option>
                        <option>C-Class</option>
                        <option>XC60</option>
                        <option>RAV4</option>
                        <option>Model 3</option>
                    </select>

                </div>


                <div class="search-field">

                    <label>Price</label>

                    <select>
                        <option>Any Price</option>
                        <option>Under €15,000</option>
                        <option>€15,000 - €25,000</option>
                        <option>€25,000 - €35,000</option>
                        <option>€35,000+</option>
                    </select>

                </div>

            </div>


            <div class="search-row">

                <div class="search-field">

                    <label>Year</label>

                    <select>
                        <option>Any Year</option>
                        <option>2024</option>
                        <option>2023</option>
                        <option>2022</option>
                        <option>2021</option>
                    </select>

                </div>


                <div class="search-field">

                    <label>Fuel Type</label>

                    <select>
                        <option>Any Fuel Type</option>
                        <option>Petrol</option>
                        <option>Diesel</option>
                        <option>Hybrid</option>
                        <option>Electric</option>
                    </select>

                </div>


                <div class="search-field">

                    <label>Location</label>

                    <input
                        type="text"
                        placeholder="Helsinki, Finland"
                    >

                </div>

            </div>


            <div class="search-actions">

                <a href="listings.html" class="search-button">
                    Search Cars
                </a>

                <button class="clear-button">
                    Clear Filters
                </button>

            </div>

        </div>


        <div class="search-info">

            <div>
                <strong>10,000+</strong>
                <span>Cars Available</span>
            </div>

            <div>
                <strong>300+</strong>
                <span>Trusted Dealers</span>
            </div>

            <div>
                <strong>15+</strong>
                <span>Years Experience</span>
            </div>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-bottom">
            <span>© 2026 YAXH. All rights reserved.</span>
            <span>Helsinki, Finland</span>
        </div>

    </footer>

</body>

</html>
